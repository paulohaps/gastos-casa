name: Deploy Production PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-pwa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build production
        run: |
          npm ci
          npm run build
          mkdir -p /tmp/production
          cp -a dist/. /tmp/production/

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - name: Replace production root and preserve previews
        run: |
          find published -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'pr-preview' \
            -exec rm -rf {} +
          cp -a /tmp/production/. published/
          touch published/.nojekyll

      - name: Publish production
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy: production PWA from main"
          git push origin gh-pages
