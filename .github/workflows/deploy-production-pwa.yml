name: Deploy Production PWA

on:
  workflow_run:
    workflows: [Validate Gastos]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Publicar main aprovado ou restaurar uma versão arquivada
        required: true
        type: choice
        options: [publish, rollback]
        default: publish
      release_id:
        description: Somente rollback — ID exibido no resumo da publicação
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: production-pwa
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode || 'publish' }}
      ROLLBACK_ID: ${{ inputs.release_id }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Verify exact main commit and successful CI
        if: env.MODE == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$SOURCE_SHA" = "$MAIN_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?branch=main&event=push&per_page=30" > /tmp/validation-runs.json
          node --input-type=module - "$SOURCE_SHA" <<'JS'
          import fs from 'node:fs';
          const runs=JSON.parse(fs.readFileSync('/tmp/validation-runs.json','utf8')).workflow_runs;
          if(!runs.some(run=>run.head_sha===process.argv[2]&&run.conclusion==='success')) throw new Error('Exact main commit has no successful validation.');
          JS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check backend and build production
        if: env.MODE == 'publish'
        run: |
          node scripts/check-production.mjs
          npm ci
          npm run build

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - name: Archive and apply selected release
        id: release
        run: |
          if [ "$MODE" = "rollback" ]; then
            node scripts/production-release.mjs --root=published --mode=rollback "--release=$ROLLBACK_ID"
          else
            SOURCE_SHA="$(git rev-parse HEAD)"
            node scripts/production-release.mjs --root=published --source=dist --mode=publish "--release=prod-${SOURCE_SHA:0:12}" "--sourceSha=$SOURCE_SHA"
          fi

      - name: Publish atomic Git snapshot
        working-directory: published
        env:
          RELEASE_ID: ${{ steps.release.outputs.release }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "$MODE: production $RELEASE_ID"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          fi

      - name: Record rollback target
        env:
          RELEASE_ID: ${{ steps.release.outputs.release }}
          PREVIOUS_ID: ${{ steps.release.outputs.previous }}
        run: |
          printf '### Production release\n\nActive: `%s`\n\nPrevious: `%s`\n\nRollback: run this workflow on main, choose **rollback**, and paste the previous ID. Database and backend remain unchanged.\n' "$RELEASE_ID" "$PREVIOUS_ID" >> "$GITHUB_STEP_SUMMARY"
