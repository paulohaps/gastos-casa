name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        if: github.event.action != 'closed'
        uses: actions/checkout@v4

      - name: Prepare preview
        if: github.event.action != 'closed'
        run: |
          mkdir -p /tmp/preview
          rsync -a --delete             --exclude '.git'             --exclude '.github'             --exclude 'backend'             --exclude 'db'             --exclude 'node_modules'             --exclude 'scripts'             --exclude 'tests'             ./ /tmp/preview/

      - name: Disable service worker inside preview
        if: github.event.action != 'closed'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/preview/js/app.js')
          s = p.read_text()
          s = s.replace(
              "if ('serviceWorker' in navigator) {",
              "if (false && 'serviceWorker' in navigator) {",
              1
          )
          p.write_text(s)
          PY

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - name: Publish or remove PR folder
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          set -e
          target="published/pr-preview/pr-${PR_NUMBER}"
          rm -rf "$target"
          if [ "$PR_ACTION" != "closed" ]; then
            mkdir -p "$target"
            cp -a /tmp/preview/. "$target/"
          fi

      - name: Commit preview branch
        working-directory: published
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "preview: PR #${PR_NUMBER} ${PR_ACTION}"
          git push origin gh-pages

      - name: Post preview URL
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://paulohaps.github.io/gastos-casa/pr-preview/pr-${{ github.event.pull_request.number }}/
        run: |
          gh pr comment "$PR_NUMBER" --body "Preview disponível: $PREVIEW_URL"
