name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        if: github.event.action != 'closed'
        uses: actions/checkout@v4

      - name: Prepare preview
        if: github.event.action != 'closed'
        run: |
          mkdir -p /tmp/preview
          rsync -a --delete             --exclude '.git'             --exclude '.github'             --exclude 'backend'             --exclude 'db'             --exclude 'node_modules'             --exclude 'scripts'             --exclude 'tests'             ./ /tmp/preview/

      - name: Disable service worker inside preview
        if: github.event.action != 'closed'
        env:
          PREVIEW_BACKEND_URL: https://br-rough-cloud-a51w4e10-gastospwa.compute.c-1.us-east-2.aws.neon.tech
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          app = Path('/tmp/preview/js/app.js')
          app_source = app.read_text()
          app_source = app_source.replace(
              "if ('serviceWorker' in navigator) {",
              "if (false && 'serviceWorker' in navigator) {",
              1
          )
          app.write_text(app_source)

          api = Path('/tmp/preview/js/api.js')
          api_source = api.read_text()
          production = 'https://br-polished-voice-a5flam43-gastospwa.compute.c-1.us-east-2.aws.neon.tech'
          preview = os.environ['PREVIEW_BACKEND_URL']
          if production not in api_source:
              raise SystemExit('Production backend URL not found in preview API bundle')
          api.write_text(api_source.replace(production, preview, 1))
          PY

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - name: Publish or remove PR folder
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          set -e
          target="published/pr-preview/pr-${PR_NUMBER}"
          versioned="published/pr-preview/pr-${PR_NUMBER}-${GITHUB_SHA::7}"
          rm -rf "$target"
          if [ "$PR_ACTION" != "closed" ]; then
            mkdir -p "$target" "$versioned"
            cp -a /tmp/preview/. "$target/"
            cp -a /tmp/preview/. "$versioned/"
          fi

      - name: Commit preview branch
        working-directory: published
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "preview: PR #${PR_NUMBER} ${PR_ACTION}"
          git push origin gh-pages

      - name: Post preview URL
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://paulohaps.github.io/gastos-casa/pr-preview/pr-${{ github.event.pull_request.number }}/
          PREVIEW_VERSIONED_URL: https://paulohaps.github.io/gastos-casa/pr-preview/pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}/
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSIONED_URL="https://paulohaps.github.io/gastos-casa/pr-preview/pr-${PR_NUMBER}-${SHORT_SHA}/"
          gh pr comment "$PR_NUMBER" --body "Preview estável: ${PREVIEW_URL}"$'\n\n'"Preview sem cache: ${VERSIONED_URL}"
