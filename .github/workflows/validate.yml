name: Validate Gastos

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Smart Entry unit tests
        run: npm run test:unit

      - name: Financial transaction regressions (Postgres)
        run: npm run test:db

      - name: Backend public smoke
        run: |
          curl --fail --retry 2 --max-time 10 https://br-polished-voice-a5flam43-gastospwa.compute.c-1.us-east-2.aws.neon.tech/health | grep -q '"ok":true'
          curl --fail --retry 2 --max-time 10 https://br-polished-voice-a5flam43-gastospwa.compute.c-1.us-east-2.aws.neon.tech/features | grep -q '"smartEntry":true'

      - name: Frontend DOM/API contract
        run: node scripts/check-frontend.mjs

      - name: Backend contract checks
        run: |
          grep -q "async salvarOrcamentos" js/api.js
          grep -q "Array.isArray(body.items)" backend/routes/budgets.mjs
          grep -q "url.pathname !== '/budgets'" backend/routes/budgets.mjs
          grep -q "url.pathname !== '/recurring'" backend/routes/recurring.mjs
          grep -q "path === '/expenses'" backend/routes/expenses.mjs
          grep -q "url.pathname !== '/members'" backend/routes/members.mjs
          grep -q "path === '/smart-entry/parse'" backend/routes/smart-entry.mjs
          grep -q "path === '/smart-entry/rules'" backend/routes/smart-entry.mjs
          grep -q "path === '/smart-entry/metrics'" backend/routes/smart-entry.mjs
          grep -q "path === '/features'" backend/index.mjs
          grep -q "url.pathname === '/receipts/inspect'" backend/routes/receipts.mjs
          grep -q "receipt_imports" db/migrations/20260919_receipt_imports.sql
          grep -q "rules-learning-history-v4" backend/index.mjs
          grep -q "inputMode" backend/routes/smart-entry.mjs
          grep -q "smart_entry_rules" db/migrations/20260919_smart_entry_learning.sql
          grep -q "smart_entry_telemetry" db/migrations/20260919_smart_entry_telemetry.sql

  visual:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual smoke
        run: npm run test:visual

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: test-results/**/*.png
          if-no-files-found: ignore
