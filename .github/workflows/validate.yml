name: Validate Gastos

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node --check js/api.js
          node --check js/app.js
          node --check js/ui.js
          node --check backend/index.mjs
          node --check backend/smart-entry/parser.mjs
          node --check backend/smart-entry/ai-provider.mjs
          node --check sw.js

      - name: Smart Entry unit tests
        run: npm run test:unit

      - name: Backend public smoke
        run: |
          curl --fail --retry 2 --max-time 10 https://br-polished-voice-a5flam43-gastospwa.compute.c-1.us-east-2.aws.neon.tech/health | grep -q '"ok":true'
          curl --fail --retry 2 --max-time 10 https://br-polished-voice-a5flam43-gastospwa.compute.c-1.us-east-2.aws.neon.tech/features | grep -q '"smartEntry":true'

      - name: Frontend DOM/API contract
        run: node scripts/check-frontend.mjs

      - name: Backend contract checks
        run: |
          grep -q "async salvarOrcamentos" js/api.js
          grep -q "Array.isArray(body.items)" backend/index.mjs
          grep -q "path === '/budgets'" backend/index.mjs
          grep -q "path === '/recurring'" backend/index.mjs
          grep -q "path === '/expenses'" backend/index.mjs
          grep -q "path === '/members'" backend/index.mjs
          grep -q "path === '/smart-entry/parse'" backend/index.mjs
          grep -q "path === '/features'" backend/index.mjs

  visual:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/gastos-http.log 2>&1 &

      - name: Visual smoke
        run: npm run test:visual

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: test-results/**/*.png
          if-no-files-found: ignore
